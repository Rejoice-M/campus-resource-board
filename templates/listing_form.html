{% extends "base.html" %}
{% block title %}Post a Listing{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Post a listing</h2>
    <form method="post">
        <label>Title <input type="text" name="title" required></label>
        <label>Category
            <select name="category_id" required>
                {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Description <textarea name="description" rows="4"></textarea></label>
        <label>Price (leave blank if free) <input type="number" step="0.01" name="price" placeholder="0.00"></label>
        <button type="submit" class="btn-primary">Post listing</button>
    </form>
</div>
{% endblock %}
