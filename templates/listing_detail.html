{% extends "base.html" %}
{% block title %}{{ listing.title }}{% endblock %}

{% block content %}
<article class="listing-page cat-{{ listing.category.name|lower|replace(' ', '-') }}">
    <span class="listing-category">{{ listing.category.name }}</span>
    <h2>{{ listing.title }}</h2>
    <p class="listing-meta">Posted by {{ listing.owner.name }}</p>
    <p class="listing-price-large">{% if listing.price %}R{{ listing.price }}{% else %}Free{% endif %}</p>
    <p class="listing-description">{{ listing.description }}</p>
</article>
{% endblock %}
